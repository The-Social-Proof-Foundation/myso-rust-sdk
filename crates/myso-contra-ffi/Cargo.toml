[package]
name = "myso-contra-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "myso_contra_ffi"

[dependencies]
myso-contra = { path = "../myso-contra" }
thiserror = "2.0"
uniffi = { version = "0.29", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
